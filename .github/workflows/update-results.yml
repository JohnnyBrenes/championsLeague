name: Update Champions League results

# Hybrid schedule:
#  - Hourly polling only on match nights, and even then the script calls the API
#    only while a match is actually in progress (MATCH_WINDOW_ONLY=1).
#  - One full daily sync to pick up any schedule/fixture changes.
#  - Manual trigger available any time.
#  - Every run retries on transient upstream failure (see the job below).
# A commit (and therefore a redeploy) only happens when data changes.

on:
  schedule:
    # Champions League is played on Tuesday and Wednesday nights, with the final
    # on a Saturday. Restricting the polling crons to those weekdays is the only
    # "run only on match days" lever GitHub gives us — cron can't read
    # data/schedule.json. The withinMatchWindow() guard in scripts/sync-data.mjs
    # handles the rest (a Tuesday with no fixtures is a no-op).
    #
    # Hourly at :05 (dodging top-of-hour congestion) over 16:00–23:59 UTC. That
    # single range covers both kickoff slots year-round: in CEST (Sep–Oct, May)
    # 18:45 local == 16:45 UTC, and in CET (Nov–Feb) 21:00 local == 20:00 UTC,
    # with room for extra time and penalties. No early-morning window is needed:
    # UTC runs BEHIND central Europe, so a European evening match never rolls
    # over into the next UTC day (the World Cup's Mexico-time kickoffs did, which
    # is why this used to have a "0-6" cron).
    #
    # GitHub delays or drops scheduled runs under load, but the per-run retry
    # (see the job below) means each firing that DOES land refreshes reliably.
    - cron: "5 16-23 * * 2,3" # Tuesday & Wednesday match nights
    - cron: "5 16-23 * * 6"   # Saturday — the final
    # Daily full sync at 12:07 UTC (catches schedule/fixture changes).
    # Keep this string identical to the one in MATCH_WINDOW_ONLY below.
    - cron: "7 12 * * *"
  workflow_dispatch: {}

concurrency:
  group: update-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sync Champions League data (retry on failure)
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          # Windowed only for the frequent polling crons; the daily 12:00 UTC
          # run and manual dispatches do a full sync.
          MATCH_WINDOW_ONLY: ${{ github.event_name == 'schedule' && github.event.schedule != '7 12 * * *' && '1' || '0' }}
        # sync-data.mjs exits non-zero when the live source (worldcup26) can't be
        # refreshed even after its own in-process retries. Retry the whole run a
        # few times (60s apart) so a transient upstream blip no longer requires
        # firing the workflow manually a second time. A no-op (no live match) or a
        # clean success returns 0 on the first attempt and skips the wait.
        run: |
          for attempt in 1 2 3; do
            echo "::group::Sync attempt $attempt"
            if node scripts/sync-data.mjs; then
              echo "::endgroup::"
              echo "Sync succeeded on attempt $attempt."
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed."
            if [ "$attempt" -lt 3 ]; then
              echo "Waiting 60s before retry…"
              sleep 60
            fi
          done
          echo "All 3 sync attempts failed."
          exit 1

      - name: Commit & push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/; then
            echo "No data changes."
          else
            git add data/
            git commit -m "chore: update results ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
